name: Check Pull Request (Demo)
permissions:
  contents: read
on:
  pull_request:
    paths:
      - 'demo/**'
      - '.github/actions/**'
  workflow_dispatch:
jobs:
  check:
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gradle
        with:
          project-directory: demo
      - run: ./gradlew check
        working-directory: ./demo
      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
